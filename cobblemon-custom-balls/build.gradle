plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'org.jetbrains.kotlin.jvm' version '2.0.21'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()

	// Cobblemon publica sus builds en el Maven de Modrinth. Es la forma mas confiable
	// de traer el jar de Cobblemon (con sus dependencias transitivas) para compilar contra el.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cobblemon es Kotlin -> necesita Fabric Language Kotlin
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Cobblemon en si. OJO: "cobblemon" es el slug del proyecto en Modrinth; reemplaza
	// cobblemon_version en gradle.properties por la version exacta que uses (formato tal
	// cual aparece en la pagina de versiones de Modrinth, ej "1.7.3").
	modImplementation "maven.modrinth:cobblemon:${project.cobblemon_version}"
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

kotlin {
	jvmToolchain(21)
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
